name: "R02 - Eventos"

on:
  workflow_dispatch:

  push:
    branches:
      - feature/r2-eventos
  
  pull_request:
    branches:
      - main
  
  # schedule:
  #   - cron: '*/15 * * * *'

jobs:
  mostrar:
    runs-on: ubuntu-latest
    steps:
      - name: "Disparo"
        run: |
          echo "Me dispararon!"
