name: 04-Using-Actions-RMov
on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: SetupNode
        uses: actions/setup-node@v3
        with:
          node-version: '24-x'
      - name: Install dependencies
        run: npm ci



