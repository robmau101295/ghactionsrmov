# ============================================================
# R09 - Funciones
# ------------------------------------------------------------
#  [ ] Nombre "R09 - Funciones", push en tu rama + PR a main + manual
#  [ ] Job "texto":
#      [ ] 1. checkout
#      [ ] 2. si rama empieza con feature/ -> "Rama de feature"
#      [ ] 3. si es PR y título contiene fix -> "Es un arreglo"
#      [ ] 4. format: <ECR_REGISTRY>/mi-app:<sha>
#      [ ] 5. hash de 04-using-actions/react-app/package-lock.json
#      [ ] 6. si evento en [push, workflow_dispatch] (contains+fromJSON)
#             -> "Disparo directo"
#  [ ] Job "estado":
#      [ ] 1. step que falla a propósito
#      [ ] 2. sin if: "Sigo vivo"
#      [ ] 3. solo si falló algo: "Notificando falla"
#      [ ] 4. siempre: "Limpieza"
# ============================================================

name: R09 - Funciones

on: 
  push:
    branches:
      - feature/9-funciones
  
  pull_request:
    branches:
      - main
  
  workflow_dispatch:


jobs:
  texto:
    runs-on: ubuntu-latest
    steps:
      - name: "Bajar el codigo"
        uses: actions/checkout@v7

      - name: "Imprimir feature"
        if: startsWith(github.ref_name, 'feature/')
        run: |
         echo "Es una rama de feature."
      
      - name: "Si es PR y titulo contiene fix"
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'fix')
        run: |
          echo "Es un arreglo"
      
      - name: "Imprimir el nombre de la imagen"
        env:
          IMAGEN: ${{ format('{0}/mi-app:{1}', vars.ECR_REGISTRY, github.sha) }}
        run: |
          echo "$IMAGEN"
      
      - name: "Imprimir el hash"
        env:
          HASH1: ${{ hashFiles('04-using-actions/react-app/package-lock.json') }}
        run: |
          echo "Hash del lock: $HASH1"

      - name: "LastStep"
        if: contains(fromJson('["push", "workflow_dispatch"]'), github.event_name)
        run: |
          echo "Disparo directo!"
  
  estado:
    runs-on: ubuntu-latest
    steps:
      - name: "A propposito"
        run: exit 1
      
      - name: "Sigo vivo"
        run: |
          echo "Sigo vivo"
      
      - name: "Notificacion falla"
        if: failure()
        run: |
          echo "Algo ha fallado"
      
      - name: "Limpieza"
        if: always()
        run: |
          echo "Limpieza"

        
